[project]
name = "nyclive"
version = "0.0.1"
description = "NYC Live: one map for New York's live and historical open data, with cameras as sensors."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Added per phase so early installs stay small. See docs/DEV_SETUP.md.
collect = ["apscheduler>=3.10", "pyarrow>=17", "duckdb>=1.1", "gtfs-realtime-bindings>=1.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
cv = ["ultralytics>=8.3", "opencv-python-headless>=4.10"]

[project.scripts]
nyclive = "nyclive.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyclive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network endpoints (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
