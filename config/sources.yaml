# Source registry: the single list of every external feed NYC Live knows about.
# Collectors, the probe command, the health page and docs/DATA_SOURCES.md all key off `id`.
#
# Fields
#   name        human label
#   phase       roadmap phase that first uses it (see docs/ROADMAP.md)
#   shape       primary shape: entities | observations | events (see docs/DATA_MODEL.md);
#               several sources also emit entities alongside it
#   cadence_s   polling interval in seconds (null = on demand)
#   auth        none | key:<ENV_VAR>
#   probe       URL used by `nyclive probe` to check reachability (may use ${ENV_VAR})
#   expect      substring the probe response must contain to count as healthy
#   status      verified | partial | unverified   (last manual check in `verified_on`)
#   adapter     module in src/nyclive/sources that collects it (omit = not collected)
#   max_lag_s   optional: data older than this is "stale" in `nyclive status`
#
# Times: every source timestamp is stored in UTC; the UI renders America/New_York.

user_agent_env: NYCLIVE_USER_AGENT
default_user_agent: "nyc-live/0.1 (+https://github.com/alexxu2027/nyc-data)"

sources:

  # ---------------------------------------------------------------- cameras
  dot_cameras:
    name: NYC DOT traffic cameras (list)
    adapter: dot_cameras
    phase: 1
    shape: entities
    cadence_s: 86400
    auth: none
    probe: https://webcams.nyctmc.org/api/cameras
    expect: '"imageUrl"'
    status: verified
    verified_on: 2026-11-14
    notes: >
      974 cameras (874 online) at probe time. Fields: id, name, latitude, longitude,
      area (borough), isOnline ("true"/"false" strings), imageUrl.

  dot_camera_image:
    name: NYC DOT camera snapshot (per camera)
    phase: 1
    shape: observations
    cadence_s: null          # UI loads on demand; CV worker polls a watchlist (Phase 4)
    auth: none
    probe: https://webcams.nyctmc.org/api/cameras/1b3248f9-f26e-4f36-943f-b7a7731595fb/image
    status: verified
    verified_on: 2026-11-14
    notes: 352x240 JPEG, ~17 KB, Cache-Control no-store, new frame roughly every 2 s.

  # --------------------------------------------------------------- citi bike
  citibike_gbfs:
    name: Citi Bike GBFS manifest
    adapter: citibike
    phase: 1
    shape: entities
    cadence_s: 86400
    auth: none
    probe: https://gbfs.citibikenyc.com/gbfs/2.3/gbfs.json
    expect: station_status
    status: verified
    verified_on: 2026-11-14
    notes: Manifest points at gbfs.lyft.com/gbfs/2.3/bkn/... Always discover feed URLs from it.

  citibike_station_status:
    name: Citi Bike station status
    adapter: citibike
    phase: 1
    shape: observations
    cadence_s: 60            # feed ttl is 60
    auth: none
    probe: https://gbfs.citibikenyc.com/gbfs/en/station_status.json
    expect: num_bikes_available
    status: verified
    verified_on: 2026-11-14
    notes: >
      2,519 stations at probe time, ~1 MB per fetch. Inactive stations report
      last_reported=86400 (a sentinel, not a real time). Store only changed rows.

  # --------------------------------------------------------------------- MTA
  mta_subway_alerts:
    name: MTA subway service alerts (GTFS-rt as JSON)
    adapter: mta_alerts
    phase: 1
    shape: events
    cadence_s: 60
    auth: none
    probe: https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/camsys%2Fsubway-alerts.json
    expect: informed_entity
    status: verified
    verified_on: 2026-11-14
    notes: ~1 MB per fetch. Dedupe on alert id + payload hash. No API key needed.

  mta_elevator_outages:
    name: MTA elevator & escalator outages
    adapter: mta_elevators
    phase: 1
    shape: events
    cadence_s: 300
    auth: none
    probe: https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fnyct_ene.json
    expect: equipment
    status: verified
    verified_on: 2026-11-14
    notes: >
      Includes planned future outages (outagedate in the future). Dates are local-time strings.
      No station id and an empty borough in this feed. Join equipment to equipmentno in
      nyct%2Fnyct_ene_equipments.json (elevatorsgtfsstopid, stationcomplexid), then to
      mta_subway_stations. Content-Type header is broken; never branch on it.

  mta_subway_stations:
    name: MTA subway stations (data.ny.gov 39hk-dx4f)
    adapter: mta_stations
    phase: 1
    shape: entities
    cadence_s: 86400
    auth: none
    probe: https://data.ny.gov/resource/39hk-dx4f.json?$limit=1
    expect: gtfs_stop_id
    status: verified
    verified_on: 2026-11-14
    notes: >
      gtfs_stop_id, complex_id, stop_name, gtfs_latitude/longitude, borough as M/Bk/Q/Bx/SI.
      Pins subway alerts and elevator outages to stations.

  mta_subway_realtime:
    name: MTA subway trip updates & vehicles (GTFS-rt protobuf)
    adapter: mta_trains
    phase: 2
    shape: events
    cadence_s: 30
    max_lag_s: 3600
    auth: none
    probe: https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs-ace
    status: verified
    verified_on: 2026-11-14
    notes: >
      Binary protobuf; decoded with the stdlib wire decoder nyclive.sources._gtfsrt (ADR-013, no
      new dependency). One feed per line group: gtfs (1-7,S), gtfs-ace, gtfs-bdfm, gtfs-g,
      gtfs-jz, gtfs-nqrw, gtfs-l, gtfs-si. One event per trip (props change only at stops).

  mta_subway_gtfs_static:
    name: MTA subway static GTFS (shapes, stops, routes)
    phase: 2
    shape: entities
    cadence_s: null
    auth: none
    probe: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_subway.zip
    status: verified
    verified_on: 2026-11-16
    notes: >
      Not collected at runtime. scripts/build_subway_static.py turns the 5.6 MB zip into the
      committed config/subway_static.json that positions trains along the track (ADR-013).

  # ----------------------------------------------------- water & weather
  noaa_tide_battery:
    name: NOAA water level, The Battery (8518750)
    adapter: noaa_tides
    phase: 1
    shape: observations
    cadence_s: 360           # station reports every 6 minutes
    auth: none
    probe: https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?station=8518750&product=water_level&date=latest&datum=MLLW&units=english&time_zone=gmt&format=json
    expect: The Battery
    status: verified
    verified_on: 2026-11-14
    notes: Also fetch product=predictions daily so the UI can show surge = observed - predicted.

  openmeteo_current:
    name: Open-Meteo current weather (borough points)
    adapter: openmeteo
    phase: 1
    shape: observations
    cadence_s: 900
    auth: none
    probe: https://api.open-meteo.com/v1/forecast?latitude=40.78&longitude=-73.97&current=temperature_2m,precipitation,rain&timezone=America/New_York
    expect: current_units
    status: verified
    verified_on: 2026-11-14
    notes: >
      Free for non-commercial use. Request several points in one call (comma-separated lat/lon).
      Collectors request timeformat=unixtime; the probe URL's timezone param returns local strings.

  nws_alerts:
    name: National Weather Service active alerts (NY)
    adapter: nws_alerts
    phase: 1
    shape: events
    cadence_s: 120
    auth: none
    probe: https://api.weather.gov/alerts/active?area=NY
    expect: FeatureCollection
    status: verified
    verified_on: 2026-11-14
    notes: >
      Filter to NYC by SAME geocodes 036005 (Bronx), 036047 (Kings), 036061 (New York),
      036081 (Queens), 036085 (Richmond). NWS asks for a contact in the User-Agent; set
      NYCLIVE_USER_AGENT yourself if you want to add one.

  floodnet_sensors:
    name: FloodNet sensor deployments (NYC Open Data kb2e-tjy3)
    adapter: floodnet
    phase: 1
    shape: entities
    cadence_s: 86400
    auth: none
    probe: https://data.cityofnewyork.us/resource/kb2e-tjy3.json?$limit=1
    expect: sensor_id
    status: verified
    verified_on: 2026-11-14
    notes: Location, borough, NTA, tidally_influenced, install date. Joins to events on sensor_id.

  floodnet_events:
    name: FloodNet flood events (NYC Open Data aq7i-eu5q)
    adapter: floodnet
    phase: 1
    shape: events
    cadence_s: 86400
    auth: none
    probe: https://data.cityofnewyork.us/resource/aq7i-eu5q.json?$limit=1&$order=flood_start_time%20DESC
    expect: max_depth_inches
    status: verified
    verified_on: 2026-11-14
    notes: >
      One row per flood event with depth profile. Not live: dataset last updated
      2026-11-02 at probe time (about two weeks behind).

  floodnet_live:
    name: FloodNet live depth (FieldKit project 174)
    adapter: floodnet_live
    phase: 1
    shape: observations
    cadence_s: 1800
    max_lag_s: 7200
    auth: none
    probe: https://api.fieldkit.org/projects
    expect: NYC FloodNet
    status: partial
    verified_on: 2026-11-16
    notes: >
      Adapter floodnet_live (ADR-010, FloodNet team OK'd polling 2026-11-16): /projects/174/stations
      plus /sensors/data/tail?stations=<25 ids> every 30 min (about 18 requests of 25 stations, ~12 MB, ~3 min),
      sensor 44 (depth, inches) only, change-only. FieldKit ids differ from Open Data sensor_id;
      parse joins them by coordinates (within 30 m, 433 of 435 active stations on 2026-11-16).
      Flood episodes (wet = 1 in, peak 2 in) become `floodnet_live` events. Powers
      dataviz.floodnet.nyc. Attribute FloodNet.

  notify_nyc:
    name: Notify NYC alerts (NYC Emergency Management, CAP RSS)
    phase: 2
    shape: events
    cadence_s: 120
    auth: none
    probe: https://feeds.everbridge.net/feeds/453003085617722/rss/rss.xml
    expect: CAP RSS Feed
    status: partial
    verified_on: 2026-11-16
    notes: >
      Planned (no adapter yet; plan in .orchestrate/notify/plan.md, research in
      docs/research/late-data-alternatives.md). RSS of the alerts active now, one item per
      language (keep `NYCEM [English]`), each with a CAP 1.2 enclosure (area polygon, expires,
      severity). Often empty: items drop out when they expire, so poll every 2 min.

  rainviewer_radar:
    name: RainViewer radar frame index
    phase: 2
    shape: observations  # raster tiles, client-only; the registry has no raster shape
    cadence_s: null
    auth: none
    probe: https://api.rainviewer.com/public/weather-maps.json
    expect: radar
    status: verified
    verified_on: 2026-11-16
    notes: >
      Not collected. The browser polls the frame index and loads tiles directly (ADR-013, kind:
      raster). Radar tiles only go to zoom 7; frames every 10 min. Attribute RainViewer.

  # ------------------------------------------------------- NYC Open Data
  nyc_311:
    name: 311 service requests (erm2-nwe9)
    adapter: nyc_311
    phase: 1
    shape: events
    cadence_s: 21600
    auth: none                # optional SOCRATA_APP_TOKEN raises rate limits
    probe: https://data.cityofnewyork.us/resource/erm2-nwe9.json?$limit=1&$order=created_date%20DESC
    expect: complaint_type
    status: verified
    verified_on: 2026-11-14
    notes: >
      Refreshes about once a day, lags 1-2 days. Do NOT cursor on :updated_at (2026-11-14:
      571,739 rows had :updated_at in the last 2 days, created back to 2020). Two bounded
      queries per run, both with $select: (1) created_date > cursor for new rows;
      (2) closed_date > cursor minus 3 days AND created_date > now minus 30 days, for closures.
      First run looks back 7 days. Upsert on unique_key. Timestamps are NY local, no offset.

  nyc_collisions:
    name: Motor vehicle collisions (h9gi-nx95)
    adapter: nyc_collisions
    phase: 1
    shape: events
    cadence_s: 86400
    auth: none
    probe: https://data.cityofnewyork.us/resource/h9gi-nx95.json?$limit=1&$order=crash_date%20DESC
    expect: crash_date
    status: verified
    verified_on: 2026-11-14
    notes: >
      Lags several days. Some rows have no coordinates. crash_date and crash_time are separate
      NY-local fields. Check whether :updated_at is a usable cursor before relying on it.

  dot_traffic_speeds:
    name: DOT real-time traffic speeds (i4gi-tjb9)
    adapter: dot_speeds
    phase: 1
    shape: observations
    cadence_s: 300
    auth: none
    probe: https://data.cityofnewyork.us/resource/i4gi-tjb9.json?$limit=1&$order=data_as_of%20DESC
    expect: link_points
    status: verified
    verified_on: 2026-11-14
    notes: >
      Road segments with speed + travel time. Build geometry from encoded_poly_line (Google
      polyline); link_points is truncated mid-coordinate. data_as_of is NY local, no offset.
      Newest row was ~2 h old at probe time, so it's near-live, not live. Check whether
      :updated_at is a usable cursor before relying on it.

  # --------------------------------------------------------------- extras
  opensky_nyc:
    name: OpenSky aircraft over NYC
    phase: 5
    shape: observations
    cadence_s: 300
    auth: none
    probe: https://opensky-network.org/api/states/all?lamin=40.4&lomin=-74.3&lamax=41.0&lomax=-73.6
    expect: states
    status: verified
    verified_on: 2026-11-14
    notes: Anonymous access has a small daily credit allowance; check current limits before raising cadence.

  kalshi_nyc_high:
    name: Kalshi "NYC daily high temperature" markets (KXHIGHNY)
    phase: 5
    shape: observations
    cadence_s: 300
    auth: none
    probe: https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXHIGHNY&limit=2&status=open
    expect: markets
    status: verified
    verified_on: 2026-11-14
    notes: Public market data needs no key. Display only; no trading code in this project.

  ny511_events:
    name: 511NY traffic events (NYSDOT developer API)
    phase: 5
    shape: events
    cadence_s: 300
    auth: key:NY511_API_KEY
    probe: https://511ny.org/api/getevents?format=json
    status: unverified
    verified_on: 2026-11-16
    notes: >
      Free key after a 511NY account and approval; 10 calls per 60 s. Incidents, crashes,
      construction and closures with lat/lon. The Developer's Access Agreement allows giving the
      data to end users with its disclaimer. Possibly state-maintained roads only (verify).
      Optional extra under ADR-007.

  openaq_nyc:
    name: OpenAQ air quality
    phase: 5
    shape: observations
    cadence_s: 1800
    auth: key:OPENAQ_API_KEY
    probe: https://api.openaq.org/v3/locations?bbox=-74.3,40.4,-73.6,41.0&limit=1
    status: unverified
    verified_on: 2026-11-14
    notes: Returned 401 without a key. Free key required (X-API-Key header).

  mta_bus_time:
    name: MTA Bus Time vehicle positions
    phase: 5
    shape: observations
    cadence_s: 60
    auth: key:MTA_BUSTIME_KEY
    probe: https://gtfsrt.prod.obanyc.com/vehiclePositions?key=${MTA_BUSTIME_KEY}
    status: unverified
    notes: Needs a free Bus Time developer key.

  basemap_openfreemap:
    name: OpenFreeMap vector basemap style
    phase: 2
    shape: entities
    cadence_s: null
    auth: none
    probe: https://tiles.openfreemap.org/styles/positron
    expect: sources
    status: verified
    verified_on: 2026-11-14
    notes: Free, no key. Fallback is CARTO basemaps or a Protomaps PMTiles file.
